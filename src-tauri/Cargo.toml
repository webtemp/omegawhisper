[package]
name = "omegawhisper"
version = "0.5.1"
description = "The most productive local-only speech to text program."
authors = ["Deyan Danailov <webtemp@gmail.com>", "shenoy.ameya@gmail.com"]
edition = "2021"

[lib]
name = "omegawhisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
chrono = "0.4"
dirs = "5"
# Downloads the model files.
ureq = { version = "2", features = ["json"] }
rubato = "0.15"
clap = { version = "4", features = ["derive"] }
# Multi-model local transcription
transcribe-rs = { version = "0.3", features = ["onnx", "whisper-cpp", "vad-silero"] }
# Turns the recorded audio into the bars the windows draw. The windows used to
# open the microphone themselves for this, which put the device into processed
# mode and made macOS wind its gain up over the first seconds of every
# recording - the first words were nearly inaudible.
rustfft = "6"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-clipboard-manager = "2.3.2"
# Start the app when the computer starts. On macOS this writes
# ~/Library/LaunchAgents/Omegawhisper.plist; nothing is asked of the user.
tauri-plugin-autostart = "2.5.1"
# Checks GitHub Releases for a newer build at startup. Only Windows is
# published there so far; macOS joins by adding its build to the release.
tauri-plugin-updater = "2"
# Only for dup2, to point the app's own output at its log file. On Windows the
# C runtime's stderr, which whisper.cpp prints through, is pointed there too.
libc = "0.2"
# Note: silero-vad-rs has ort version conflict with transcribe-rs, using simple energy-based VAD instead

[dependencies.async-trait]
version = "0.1"

[dependencies.tokio]
version = "1"
features = ["sync", "rt-multi-thread", "macros", "time"]


[target.'cfg(target_os = "linux")'.dependencies]
# The dictation key on Wayland: the desktop's own GlobalShortcuts portal.
# X11 key grabs cannot see keys under Wayland.
ashpd = { version = "0.13", features = ["global_shortcuts"] }
futures-util = "0.3"
# The clipboard for pasting what ydotool cannot type. The clipboard plugin's
# copy has no Wayland support and goes through XWayland, which a Wayland
# terminal could not read from in time.
arboard = { version = "3", features = ["wayland-data-control"] }
# Puts the indicator on the overlay layer, where Wayland lets it be placed
# and kept above everything without taking focus.
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
# Whisper on the GPU through Vulkan.
transcribe-rs = { version = "0.3", features = ["whisper-vulkan"] }

[target.'cfg(unix)'.dependencies]
# The D-Bus service and the `transcribe toggle` CLI that calls it.
zbus = "5"

[target.'cfg(windows)'.dependencies]
# SendInput for typing and Enter, the registry for the taskbar theme, and
# SetStdHandle for the log file.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
    "Win32_System_Console",
] }
# The clipboard for the paste fallback, the same crate as on Linux.
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# Posts typed text as Unicode key events. Version matches the copy Tauri
# already pulls in, so this adds no extra build.
core-graphics = "0.25"
# Run the models on the Mac GPU instead of the CPU. Without these the log
# says "no GPU found" and falls back to BLAS on the CPU, which took about
# 7 seconds for 3 seconds of speech. Cargo adds these features to the ones
# already listed in [dependencies]. Kept macOS-only: Metal and CoreML do
# not exist on Linux.
transcribe-rs = { version = "0.3", features = ["whisper-metal", "ort-coreml"] }
